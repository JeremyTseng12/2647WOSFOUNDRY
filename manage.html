<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理後台 - 兵工廠管理系統</title>
    <link rel="stylesheet" href="https://jeremytseng12.github.io/2647WOSFOUNDRY/css/manage.css" />
    <link
      rel="icon"
      type="image/webp"
      href="https://jeremytseng12.github.io/2647WOSFOUNDRY/media/foundry.webp"
    />
  </head>
  <body>
    <!-- 登入驗證畫面 -->
    <div id="loginOverlay" class="login-container">
      <div class="login-card">
        <h2>系統登入</h2>
        <p class="login-subtitle">請輸入管理員帳號與密碼</p>
        <div class="form-group">
          <label>帳號</label>
          <input
            type="text"
            id="loginAccount"
            placeholder="請輸入帳號"
            autofocus
          />
        </div>
        <div class="form-group">
          <label>密碼</label>
          <input
            type="password"
            id="loginPasskey"
            placeholder="請輸入密碼"
            onkeydown="if (event.key === 'Enter') handleLogin();"
          />
        </div>
        <button class="btn-primary" onclick="handleLogin()">登入</button>
        <div id="loginError" class="error-text"></div>
      </div>
    </div>

    <!-- 主管理介面 -->
    <div id="mainApp" class="app-layout" style="display: none">
      <!-- 頂部黑色導覽列 -->
      <header class="top-navbar">
        <div class="nav-brand">兵工廠人員分配系統 3.0 - 管理後台</div>
        <div class="nav-user-info">
          <span id="userNameDisplay">使用者</span>
          <span id="userRoleBadge" class="role-tag">管理員</span>
          <button class="btn-text" onclick="handleLogout()">登出</button>
        </div>
      </header>

      <!-- 頁籤導覽 -->
      <nav class="sub-nav">
        <button class="tab-btn active" onclick="switchTab('dashboard')">
          系統總覽
        </button>
        <button class="tab-btn" onclick="switchTab('history')">歷史紀錄</button>
        <button class="tab-btn supreme-only" onclick="switchTab('users')">
          帳號管理
        </button>
        <button class="tab-btn supreme-only" onclick="switchTab('config')">
          系統設定
        </button>
        <a
          href="https://jeremytseng12.github.io/2647WOSFOUNDRY/"
          class="tab-link"
          target="_blank"
          >返回分配系統 ↗</a
        >
      </nav>

      <!-- 內容區域 -->
      <main class="content-container">
        <!-- 1. 系統總覽 (Dashboard) -->
        <section id="tabDashboard" class="tab-panel active">
          <h3>系統總覽</h3>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-title">分配紀錄總數</div>
              <div id="statTotalRecords" class="stat-value"></div>
            </div>
            <div class="stat-card">
              <div class="stat-title">系統帳號總數</div>
              <div id="statTotalUsers" class="stat-value"></div>
            </div>
            <div class="stat-card">
              <div class="stat-title">當前運作狀態</div>
              <div id="statSystemStatus" class="stat-value status-text-active">
                讀取資料中...
              </div>
            </div>
          </div>
        </section>

        <!-- 2. 歷史紀錄管理 -->
        <section id="tabHistory" class="tab-panel">
          <div class="panel-header">
            <h3>分配紀錄管理</h3>
            <button class="btn-secondary" onclick="loadHistoryData()">
              重新整理
            </button>
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>列號</th>
                  <th>發布時間</th>
                  <th>標題</th>
                  <th>發布者</th>
                  <th>狀態</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="historyTableBody">
                <tr>
                  <td colspan="6" class="text-center">載入中...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <!-- 3. 帳號管理 (最高管理員專屬) -->
        <section id="tabUsers" class="tab-panel supreme-only">
          <div class="panel-header">
            <h3>管理員名冊</h3>
            <button class="btn-primary" onclick="openUserModal()">
              新增帳號
            </button>
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>列號</th>
                  <th>帳號</th>
                  <th>密碼</th>
                  <th>顯示名稱</th>
                  <th>權限角色</th>
                  <th>狀態</th>
                  <th>建立時間</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <tr>
                  <td colspan="8" class="text-center">載入中...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <!-- 4. 系統設定 (最高管理員專屬) -->
        <section id="tabConfig" class="tab-panel supreme-only">
          <h3>系統設定與公告</h3>
          <div class="config-card">
            <div class="form-group">
              <label>系統運作狀態</label>
              <select id="configSystemStatus" class="form-control">
                <option value="active">正常開放 (Active)</option>
                <option value="maintenance">系統維護中 (Maintenance)</option>
                <option value="offline">伺服器離線 (Offline)</option>
              </select>
            </div>
            <div class="form-group">
              <label>分配系統公告</label>
              <textarea
                id="configAnnouncement"
                class="form-control"
                rows="3"
                placeholder="請輸入公告內容..."
              ></textarea>
            </div>
            <button class="btn-primary" onclick="saveSystemConfig()">
              儲存設定
            </button>
          </div>
        </section>
      </main>
    </div>

    <!-- 新增帳號彈窗 -->
    <div id="userModal" class="modal-overlay" style="display: none">
      <div class="modal-card">
        <h3>新增管理員帳號</h3>
        <div class="form-group">
          <label>帳號</label>
          <input type="text" id="newAccount" class="form-control" />
        </div>
        <div class="form-group">
          <label>密碼</label>
          <input type="text" id="newPasskey" class="form-control" />
        </div>
        <div class="form-group">
          <label>顯示名稱</label>
          <input type="text" id="newDisplayName" class="form-control" />
        </div>
        <div class="form-group">
          <label>權限角色</label>
          <select id="newRole" class="form-control">
            <option value="manager">管理員</option>
            <option value="supreme">最高管理員</option>
          </select>
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" onclick="closeUserModal()">取消</button>
          <button class="btn-primary" onclick="submitNewUser()">
            確認建立
          </button>
        </div>
      </div>
    </div>

    <script src="https://jeremytseng12.github.io/2647WOSFOUNDRY/js/manage.js"></script>
  </body>
</html>
