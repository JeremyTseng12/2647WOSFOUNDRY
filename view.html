<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>兵工廠人員分配 - 公開戰況檢視</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montenegrin+Gothic+One&family=Noto+Sans+HK:wght@500;700;900&family=Share+Tech+Mono&family=ZCOOL+Xiaowei&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-cyber: #080b11;
        --panel-bg: #0f1524;
        --panel-border: #1a233a;
        --text-neon: #00ffcc;
        --text-main: #e2e8f0;
        --text-muted: #4e6178;

        --color-g0: #ff3838;
        --color-g1: #bc4fff;
        --color-g2: #00ff66;
        --color-g3: #ffb300;
      }

      * {
        box-sizing: border-box;
        user-select: none;
      }
      input,
      textarea {
        user-select: text !important;
      }

      body {
        font-family: "Montenegrin Gothic One", "Noto Sans HK", sans-serif;
        background-color: var(--bg-cyber);
        background-image:
          linear-gradient(rgba(26, 35, 58, 0.4) 1px, transparent 1px),
          linear-gradient(90deg, rgba(26, 35, 58, 0.4) 1px, transparent 1px);
        background-size: 25px 25px;
        color: var(--text-main);
        margin: 0;
        padding: 40px 20px;
        overflow-x: hidden;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: var(--panel-bg);
        border: 2px solid var(--panel-border);
        padding: 40px;
        border-radius: 4px;
        box-shadow:
          0 25px 60px rgba(0, 0, 0, 0.7),
          inset 0 0 30px rgba(0, 255, 204, 0.03);
        position: relative;
      }
      .container::before {
        content: "";
        position: absolute;
        top: -2px;
        left: -2px;
        width: 20px;
        height: 20px;
        border-top: 4px solid var(--text-neon);
        border-left: 4px solid var(--text-neon);
      }
      .container::after {
        content: "";
        position: absolute;
        bottom: -2px;
        right: -2px;
        width: 20px;
        height: 20px;
        border-bottom: 4px solid var(--text-neon);
        border-right: 4px solid var(--text-neon);
      }

      h1 {
        text-align: center;
        color: #fff;
        font-family: "ZCOOL Xiaowei", sans-serif;
        font-size: 2.5rem;
        font-weight: 900;
        letter-spacing: 2px;
        margin-top: 0;
        margin-bottom: 10px;
        text-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
      }

      .meta-info {
        text-align: center;
        color: #7ee8cc;
        font-size: 0.95rem;
        margin-bottom: 30px;
        font-family: "Share Tech Mono", monospace;
      }
      .meta-info span {
        color: #fff;
        font-weight: bold;
      }

      .summary-box {
        background: #090e1a;
        border: 1px solid #1a233a;
        padding: 22px;
        border-radius: 4px;
        margin-bottom: 30px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
      }
      .summary-box p {
        margin: 0;
        font-size: 0.95rem;
        color: #94a3b8;
        font-weight: 700;
      }
      .summary-box strong {
        font-family: "Share Tech Mono", monospace;
        font-size: 1.7rem;
        color: var(--text-neon);
        display: block;
        margin-top: 4px;
      }

      .action-bar-copy {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 15px;
      }
      .btn-copy {
        background: linear-gradient(135deg, #00ff66, #00b344);
        color: #080b11;
        border: none;
        padding: 10px 24px;
        font-size: 0.95rem;
        font-weight: 900;
        border-radius: 4px;
        cursor: pointer;
      }
      .copy-lang-switch {
        display: flex;
        gap: 4px;
        background: #060a12;
        padding: 4px;
        border: 1px solid #1a233a;
        border-radius: 4px;
      }
      .btn-copy-lang {
        background: transparent;
        color: var(--text-muted);
        border: none;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 0.8rem;
        border-radius: 2px;
      }
      .btn-copy-lang.active {
        background: #1a233a;
        color: var(--text-neon);
      }

      .copy-textarea {
        width: 100%;
        background-color: #060a12;
        font-family: "Share Tech Mono", monospace;
        font-size: 0.95rem;
        border: 1px solid #1a233a;
        color: #a7f3d0;
        height: 220px;
        padding: 12px;
        border-radius: 4px;
      }

      .building-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }
      .building-card {
        background: #090e1a;
        border: 1px solid #1a233a;
        border-radius: 4px;
        padding: 18px;
        min-height: 180px;
        display: flex;
        flex-direction: column;
      }
      .b-group-0 {
        border-top: 4px solid var(--color-g0);
      }
      .b-group-1 {
        border-top: 4px solid var(--color-g1);
      }
      .b-group-2 {
        border-top: 4px solid var(--color-g2);
      }
      .b-group-3 {
        border-top: 4px solid var(--color-g3);
      }
      .b-group-spec {
        border-top: 4px solid #00ffcc;
        background: rgba(0, 255, 204, 0.02);
      }

      .building-title {
        font-weight: 900;
        font-size: 1rem;
        color: #fff;
        margin-bottom: 6px;
      }
      .building-power {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid #1a233a;
      }
      .drop-zone {
        flex-grow: 1;
        min-height: 90px;
      }

      .player-tag {
        background-color: #121929;
        border: 1px solid #223052;
        padding: 10px 12px;
        margin-bottom: 8px;
        border-radius: 2px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        color: #cbd5e1;
      }
      .player-tag.is-leader {
        border: 1px solid rgba(255, 179, 0, 0.4);
        background-color: rgba(255, 179, 0, 0.05);
        color: #ffe066;
      }
      .player-tag.is-vice {
        border: 1px solid rgba(0, 170, 255, 0.4);
        background-color: rgba(0, 170, 255, 0.08);
        color: #99d6ff;
      }
      .tag-leader-label {
        background: #ffb300;
        color: #080b11;
        font-size: 0.7rem;
        padding: 1px 5px;
        margin-right: 6px;
        font-weight: 900;
      }
      .tag-vice-label {
        background: #00aaff;
        color: #080b11;
        font-size: 0.7rem;
        padding: 1px 5px;
        margin-right: 6px;
        font-weight: 900;
      }

      #loadingScreen {
        text-align: center;
        padding: 60px 0;
      }
      .loader-img {
        width: 120px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="loadingScreen">
        <img
          class="loader-img"
          src="https://i.ibb.co/HTd6TVYF/Loading-40-Paperplane.gif"
          alt="Loading..."
        />
        <p style="color: #7ee8cc; margin-top: 15px">讀取最新戰況資料中...</p>
      </div>

      <div id="contentSection" style="display: none">
        <h1 id="viewTitle">加載中...</h1>
        <div class="meta-info">
          分配指揮官：<span id="viewAuthor">-</span> ｜ 發布時間：<span
            id="viewTime"
            >-</span
          >
        </div>

        <div class="summary-box" id="summaryBox"></div>

        <h2
          style="
            color: #fff;
            font-family: &quot;ZCOOL Xiaowei&quot;, sans-serif;
            border-left: 4px solid var(--text-neon);
            padding-left: 12px;
          "
        >
          📋 分配名單 (可直接複製)
        </h2>
        <div class="action-bar-copy">
          <button class="btn-copy" onclick="copyText()">
            點擊一鍵複製名單
          </button>
          <div class="copy-lang-switch">
            <button
              id="btnLangZht"
              class="btn-copy-lang active"
              onclick="switchCopyLang('zht')"
            >
              複製中文版
            </button>
            <button
              id="btnLangEn"
              class="btn-copy-lang"
              onclick="switchCopyLang('en')"
            >
              複製英文版
            </button>
          </div>
        </div>
        <textarea id="copyTextarea" class="copy-textarea" readonly></textarea>

        <h2
          style="
            color: #fff;
            font-family: &quot;ZCOOL Xiaowei&quot;, sans-serif;
            border-left: 4px solid var(--text-neon);
            padding-left: 12px;
            margin-top: 30px;
          "
        >
          ⚡ 建築物人員配置看板
        </h2>
        <div class="building-grid" id="buildingGrid"></div>
      </div>
    </div>

    <script>
      // ⚠️ 請填入相同的 GAS Web App URL ⚠️
      const GAS_WEB_APP_URL =
        "https://script.google.com/macros/s/AKfycbxfxppYSi_pFUkvzlxnk3IlF568Mu7ihgZrHCR03WPHleZv0ftkOYbwLkCy467X3mG0/exec";

      const buildingsConfig = [
        {
          id: "b0",
          nameZht: "1號武器試驗場",
          nameEn: "Prototype Site I",
          gIdx: 0,
        },
        {
          id: "b1",
          nameZht: "1號武器維修廠",
          nameEn: "Repair Facility I",
          gIdx: 0,
        },
        {
          id: "b2",
          nameZht: "2號武器試驗場",
          nameEn: "Prototype Site II",
          gIdx: 1,
        },
        {
          id: "b3",
          nameZht: "2號武器維修廠",
          nameEn: "Repair Facility II",
          gIdx: 1,
        },
        {
          id: "b4",
          nameZht: "3號武器維修廠",
          nameEn: "Repair Facility III",
          gIdx: 2,
        },
        { id: "b5", nameZht: "中轉站.", nameEn: "Transit Station", gIdx: 2 },
        {
          id: "b6",
          nameZht: "4號武器維修廠",
          nameEn: "Repair Facility IV",
          gIdx: 3,
        },
        { id: "b7", nameZht: "蒸氣鍋爐", nameEn: "Boiler Room", gIdx: 3 },
      ];

      let fetchedData = null;
      let currentCopyLang = "zht";

      window.addEventListener("load", fetchLatestData);

      function fetchSheetData() {
        fetch(GAS_WEB_APP_URL)
          .then((res) => res.json())
          .then((res) => {
            if (res.status === "empty" || !res.payload) {
              alert("目前試算表中尚無發布的戰況紀錄！");
              return;
            }
            fetchedData = res;
            renderViewer();
          })
          .catch((err) => {
            console.error("讀取資料失敗：", err);
            alert(
              "讀取失敗，請確認 GAS URL 是否設定正確且存取權限為「所有人」。",
            );
          });
      }

      function fetchLatestData() {
        if (
          GAS_WEB_APP_URL === "YOUR_GAS_WEB_APP_URL_HERE" ||
          !GAS_WEB_APP_URL
        ) {
          alert("請在 HTML 中填寫 GAS_WEB_APP_URL！");
          return;
        }
        fetchSheetData();
      }

      function renderViewer() {
        document.getElementById("loadingScreen").style.display = "none";
        document.getElementById("contentSection").style.display = "block";

        const p = fetchedData.payload;
        document.getElementById("viewTitle").innerText =
          fetchedData.title || "兵工廠人員分配";
        document.getElementById("viewAuthor").innerText =
          fetchedData.author || "指揮官";
        document.getElementById("viewTime").innerText =
          fetchedData.updateTime || "";

        // 渲染數據總計
        document.getElementById("summaryBox").innerHTML = `
          <p>總參戰人數 <strong>${p.summary ? p.summary.totalPeople : 0}</strong></p>
          <p>總體總戰力 <strong>${p.summary ? p.summary.totalPower.toLocaleString() : 0}</strong></p>
          <p>每大組平均戰力 <strong>${p.summary ? p.summary.avgPower.toLocaleString() : 0}</strong></p>
        `;

        // 渲染 8 大建築
        const grid = document.getElementById("buildingGrid");
        grid.innerHTML = "";

        buildingsConfig.forEach((b) => {
          const card = document.createElement("div");
          card.className = `building-card b-group-${b.gIdx}`;

          let bPower = 0;
          let pTagsHtml = "";
          const list = p.buildings[b.id] || [];

          list.forEach((player) => {
            bPower += player.power || 0;
            let roleClass = "";
            roleLabel = "";
            if (player.isLeader) {
              roleClass = "is-leader";
              roleLabel = `<span class="tag-leader-label">隊長</span>`;
            } else if (player.isVice) {
              roleClass = "is-vice";
              roleLabel = `<span class="tag-vice-label">副隊長</span>`;
            }

            pTagsHtml += `
              <div class="player-tag ${roleClass}">
                <span>${roleLabel}${player.name}</span>
                <strong style="color:var(--text-neon); font-family: 'Share Tech Mono';">${player.power || ""}</strong>
              </div>
            `;
          });

          card.innerHTML = `
            <div class="building-title">${b.nameZht}</div>
            <div class="building-power">目前戰力：<strong>${bPower.toLocaleString()}</strong></div>
            <div class="drop-zone">${pTagsHtml}</div>
          `;
          grid.appendChild(card);
        });

        // 採集小隊
        const gatherCard = document.createElement("div");
        gatherCard.className = "building-card b-group-spec";
        let gatherArr = p.manualGatherText
          ? p.manualGatherText.split("\n")
          : [];
        let gatherTags = gatherArr
          .map((name) =>
            name.trim()
              ? `<div class="player-tag"><span>⚡ ${name.trim()}</span></div>`
              : "",
          )
          .join("");
        gatherCard.innerHTML = `
          <div class="building-title">採集小隊</div>
          <div class="building-power">戰場開啟15分鐘後負責幫忙採集</div>
          <div class="drop-zone">${gatherTags || '<div style="color:var(--text-muted);font-size:0.85rem;padding:10px;">(未指派人員)</div>'}</div>
        `;
        grid.appendChild(gatherCard);

        // 子彈小隊
        const ammoCard = document.createElement("div");
        ammoCard.className = "building-card b-group-spec";
        let ammoArr = p.manualAmmoText ? p.manualAmmoText.split("\n") : [];
        let ammoTags = ammoArr
          .map((name) =>
            name.trim()
              ? `<div class="player-tag" style="border-color:#ff3838;"><span>🎒 ${name.trim()}</span></div>`
              : "",
          )
          .join("");
        ammoCard.innerHTML = `
          <div class="building-title">子彈小隊</div>
          <div class="building-power">當建築防守失敗時幫忙撿散落子彈</div>
          <div class="drop-zone">${ammoTags || '<div style="color:var(--text-muted);font-size:0.85rem;padding:10px;">(未指派人員)</div>'}</div>
        `;
        grid.appendChild(ammoCard);

        switchCopyLang("zht");
      }

      function switchCopyLang(lang) {
        currentCopyLang = lang;
        if (lang === "zht") {
          document.getElementById("btnLangZht").classList.add("active");
          document.getElementById("btnLangEn").classList.remove("active");
          document.getElementById("copyTextarea").value =
            fetchedData.payload.copyTextZht || "";
        } else {
          document.getElementById("btnLangEn").classList.add("active");
          document.getElementById("btnLangZht").classList.remove("active");
          document.getElementById("copyTextarea").value =
            fetchedData.payload.copyTextEn || "";
        }
      }

      function copyText() {
        const textarea = document.getElementById("copyTextarea");
        textarea.select();
        navigator.clipboard.writeText(textarea.value);
        alert("名單已成功複製到剪貼簿！");
      }
    </script>
  </body>
</html>
