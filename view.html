<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>兵工廠人員分配 - 分配結果顯示</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montenegrin+Gothic+One&family=Noto+Sans+HK:wght@500;700;900&family=Share+Tech+Mono&family=ZCOOL+Xiaowei&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-cyber: #080b11;
        --panel-bg: #0f1524;
        --panel-border: #1a233a;
        --text-neon: #00ffcc;
        --text-main: #e2e8f0;
        --text-muted: #4e6178;

        --color-g0: #ff3838;
        --color-g1: #bc4fff;
        --color-g2: #00ff66;
        --color-g3: #ffb300;
      }

      * {
        box-sizing: border-box;
        user-select: none;
      }
      input,
      textarea,
      select {
        user-select: text !important;
      }

      body {
        font-family: "Montenegrin Gothic One", "Noto Sans HK", sans-serif;
        background-color: var(--bg-cyber);
        background-image:
          linear-gradient(rgba(26, 35, 58, 0.4) 1px, transparent 1px),
          linear-gradient(90deg, rgba(26, 35, 58, 0.4) 1px, transparent 1px);
        background-size: 25px 25px;
        color: var(--text-main);
        margin: 0;
        padding: 40px 20px;
        overflow-x: hidden;
      }

      body.lang-en h1,
      body.lang-en h2,
      body.lang-en .building-title {
        font-family: "Montenegrin Gothic One", sans-serif !important;
      }

      .container {
        max-width: 1600px;
        margin: 0 auto;
        background: var(--panel-bg);
        border: 2px solid var(--panel-border);
        padding: 40px;
        border-radius: 4px;
        box-shadow:
          0 25px 60px rgba(0, 0, 0, 0.7),
          inset 0 0 30px rgba(0, 255, 204, 0.03);
        position: relative;
      }
      .container::before {
        content: "";
        position: absolute;
        top: -2px;
        left: -2px;
        width: 20px;
        height: 20px;
        border-top: 4px solid var(--text-neon);
        border-left: 4px solid var(--text-neon);
      }
      .container::after {
        content: "";
        position: absolute;
        bottom: -2px;
        right: -2px;
        width: 20px;
        height: 20px;
        border-bottom: 4px solid var(--text-neon);
        border-right: 4px solid var(--text-neon);
      }

      .top-control-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 25px;
      }

      .history-selector-box {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-grow: 1;
        max-width: 600px;
      }
      .history-selector-box label {
        color: var(--text-neon);
        font-size: 0.9rem;
        font-weight: bold;
        white-space: nowrap;
      }
      select.history-select {
        width: 100%;
        background: #060a12;
        border: 1px solid var(--text-neon);
        color: #fff;
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 0.95rem;
        font-family: "Noto Sans HK", sans-serif;
        outline: none;
        box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
        cursor: pointer;
      }

      .lang-switch-top {
        display: flex;
        gap: 8px;
      }
      .btn-lang {
        background: #141c30;
        color: var(--text-muted);
        border: 1px solid #223052;
        padding: 5px 16px;
        font-family: "Share Tech Mono", monospace;
        font-size: 0.85rem;
        border-radius: 2px;
        cursor: pointer;
      }
      .btn-lang.active {
        background: transparent;
        color: var(--text-neon);
        border-color: var(--text-neon);
        text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
      }

      /* [新增] 軍團切換按鈕區 */
      .legion-switch-bar {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 20px 0;
      }
      .btn-legion {
        background: #090e1a;
        color: var(--text-muted);
        border: 1px solid #1a233a;
        padding: 10px 25px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-legion.active {
        background: rgba(0, 255, 204, 0.1);
        color: var(--text-neon);
        border-color: var(--text-neon);
        box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
      }

      h1 {
        text-align: center;
        color: #fff;
        font-family: "ZCOOL Xiaowei", sans-serif;
        font-size: 2.5rem;
        font-weight: 900;
        letter-spacing: 2px;
        margin-top: 10px;
        margin-bottom: 10px;
        text-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
      }

      .meta-info {
        text-align: center;
        color: #7ee8cc;
        font-size: 0.95rem;
        margin-bottom: 25px;
        font-family: "Share Tech Mono", monospace;
      }
      .meta-info span {
        color: #fff;
        font-weight: bold;
      }

      .summary-box {
        background: #090e1a;
        border: 1px solid #1a233a;
        padding: 22px;
        border-radius: 4px;
        margin-bottom: 30px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
      }
      .summary-box p {
        margin: 0;
        font-size: 0.95rem;
        color: #94a3b8;
        font-weight: 700;
      }
      .summary-box strong {
        font-family: "Share Tech Mono", monospace;
        font-size: 1.7rem;
        color: var(--text-neon);
        display: block;
        margin-top: 4px;
      }

      .action-bar-copy {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 15px;
      }
      .btn-copy {
        background: linear-gradient(135deg, #00ff66, #00b344);
        color: #080b11;
        border: none;
        padding: 10px 24px;
        font-size: 0.95rem;
        font-weight: 900;
        border-radius: 4px;
        cursor: pointer;
      }
      .copy-lang-switch {
        display: flex;
        gap: 4px;
        background: #060a12;
        padding: 4px;
        border: 1px solid #1a233a;
        border-radius: 4px;
      }
      .btn-copy-lang {
        background: transparent;
        color: var(--text-muted);
        border: none;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 0.8rem;
        border-radius: 2px;
      }
      .btn-copy-lang.active {
        background: #1a233a;
        color: var(--text-neon);
      }

      .copy-textarea {
        width: 100%;
        background-color: #060a12;
        font-family: "Share Tech Mono", monospace;
        font-size: 0.95rem;
        border: 1px solid #1a233a;
        color: #a7f3d0;
        height: 220px;
        padding: 12px;
        border-radius: 4px;
      }

      /* 精準 6 欄網格排版 */
      .building-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 15px;
        margin-top: 20px;
      }

      @media (max-width: 1400px) {
        .building-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (max-width: 768px) {
        .building-grid {
          grid-template-columns: repeat(1, 1fr);
        }
      }

      .building-card {
        background: #090e1a;
        border: 1px solid #1a233a;
        border-radius: 4px;
        padding: 18px;
        min-height: 180px;
        display: flex;
        flex-direction: column;
      }
      .b-group-0 {
        border-top: 4px solid var(--color-g0);
      }
      .b-group-1 {
        border-top: 4px solid var(--color-g1);
      }
      .b-group-2 {
        border-top: 4px solid var(--color-g2);
      }
      .b-group-3 {
        border-top: 4px solid var(--color-g3);
      }

      /* 特殊小隊：跨越 2 列 (垂直延伸) */
      .b-group-spec {
        border-top: 4px solid #00ffcc;
        background: rgba(0, 255, 204, 0.02);
        grid-row: span 2;
      }

      @media (max-width: 1400px) {
        .b-group-spec {
          grid-row: span 1;
        }
      }

      .building-title {
        font-weight: 900;
        font-size: 1rem;
        color: #fff;
        margin-bottom: 6px;
      }
      .building-power {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid #1a233a;
      }
      .drop-zone {
        flex-grow: 1;
        min-height: 90px;
      }

      .player-tag {
        background-color: #121929;
        border: 1px solid #223052;
        padding: 10px 12px;
        margin-bottom: 8px;
        border-radius: 2px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        color: #cbd5e1;
      }
      .player-tag.is-leader {
        border: 1px solid rgba(255, 179, 0, 0.4);
        background-color: rgba(255, 179, 0, 0.05);
        color: #ffe066;
      }
      .player-tag.is-vice {
        border: 1px solid rgba(0, 170, 255, 0.4);
        background-color: rgba(0, 170, 255, 0.08);
        color: #99d6ff;
      }
      .tag-leader-label {
        background: #ffb300;
        color: #080b11;
        font-size: 0.7rem;
        padding: 1px 5px;
        margin-right: 6px;
        font-weight: 900;
      }
      .tag-vice-label {
        background: #00aaff;
        color: #080b11;
        font-size: 0.7rem;
        padding: 1px 5px;
        margin-right: 6px;
        font-weight: 900;
      }

      #loadingScreen {
        text-align: center;
        padding: 60px 0;
      }
      .loader-img {
        width: 150px;
        height: auto;
      }

      /* [新增] 密碼彈窗樣式 */
      .cyber-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(4, 6, 10, 0.85);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }
      .cyber-modal {
        background: #0f1524;
        border: 2px solid var(--text-neon);
        box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
        width: 90%;
        max-width: 450px;
        padding: 30px;
        border-radius: 4px;
      }
      .cyber-modal h3 {
        margin-top: 0;
        color: #fff;
        border-bottom: 1px solid #1a233a;
        padding-bottom: 10px;
      }
      .cyber-modal-actions {
        display: flex;
        gap: 15px;
        margin-top: 25px;
      }
      .btn-modal-confirm {
        flex: 1;
        background: linear-gradient(135deg, #00ffcc, #00aaff);
        color: #080b11;
        font-weight: 900;
        padding: 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn-modal-cancel {
        flex: 1;
        background: #141c30;
        color: #94a3b8;
        border: 1px solid #223052;
        padding: 12px;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="top-control-bar">
        <div class="history-selector-box">
          <label id="uiSelectLabel">📜 選擇戰局紀錄：</label>
          <select
            id="historySelect"
            class="history-select"
            onchange="onSelectHistoryChange()"
          ></select>
        </div>
        <div class="lang-switch-top">
          <button
            id="btnLangZht"
            class="btn-lang active"
            onclick="changeLanguage('zht')"
          >
            ZH-TW
          </button>
          <button
            id="btnLangEn"
            class="btn-lang"
            onclick="changeLanguage('en')"
          >
            EN-US
          </button>
        </div>
      </div>

      <div id="loadingScreen">
        <img
          class="loader-img"
          src="https://i.ibb.co/HTd6TVYF/Loading-40-Paperplane.gif"
          alt="Loading..."
        />
        <p style="color: #7ee8cc; margin-top: 15px">讀取最新分配資料中...</p>
      </div>

      <div id="contentSection" style="display: none">
        <h1 id="viewTitle">加載中...</h1>
        <div class="meta-info">
          <span id="uiMetaAuthorLabel">分配人員：</span
          ><span id="viewAuthor">-</span> ｜
          <span id="uiMetaTimeLabel">發布時間：</span
          ><span id="viewTime">-</span>
        </div>

        <!-- [新增] 軍團切換按鈕區 -->
        <div class="legion-switch-bar">
          <button
            id="btnLegionA"
            class="btn-legion active"
            onclick="switchLegion('LegionA')"
          >
            🛡️ 軍團 1 (Legion 1)
          </button>
          <button
            id="btnLegionB"
            class="btn-legion"
            onclick="switchLegion('LegionB')"
          >
            ⚔️ 軍團 2 (Legion 2)
          </button>
        </div>

        <div class="summary-box" id="summaryBox"></div>

        <h2
          id="uiCopyTitle"
          style="
            color: #fff;
            font-family: &quot;ZCOOL Xiaowei&quot;, sans-serif;
            border-left: 4px solid var(--text-neon);
            padding-left: 12px;
          "
        >
          📋 分配名單 (可直接複製)
        </h2>
        <div class="action-bar-copy">
          <button id="btnCopyText" class="btn-copy" onclick="copyText()">
            點擊一鍵複製名單
          </button>
          <div class="copy-lang-switch">
            <button
              id="btnCopyLangZht"
              class="btn-copy-lang active"
              onclick="switchCopyLang('zht')"
            >
              ZH-TW
            </button>
            <button
              id="btnCopyLangEn"
              class="btn-copy-lang"
              onclick="switchCopyLang('en')"
            >
              EN-US
            </button>
          </div>
        </div>
        <textarea id="copyTextarea" class="copy-textarea" readonly></textarea>

        <h2
          id="uiTweakTitle"
          style="
            color: #fff;
            font-family: &quot;ZCOOL Xiaowei&quot;, sans-serif;
            border-left: 4px solid var(--text-neon);
            padding-left: 12px;
            margin-top: 30px;
          "
        >
          ⚡ 建築物人員配置看板
        </h2>
        <div class="building-grid" id="buildingGrid"></div>
      </div>
    </div>

    <!-- [新增] 密碼驗證彈窗 -->
    <div id="passcodeModal" class="cyber-modal-overlay">
      <div class="cyber-modal">
        <h3>🔒 存取密碼驗證</h3>
        <div style="margin: 20px 0">
          <p style="color: #cbd5e1; font-size: 0.9rem">
            此活動已受密碼保護，請輸入存取密碼：
          </p>
          <input
            type="password"
            id="inputPasscode"
            placeholder="請輸入密碼"
            style="
              width: 100%;
              padding: 10px;
              background: #060a12;
              border: 1px solid #223052;
              color: #fff;
              border-radius: 4px;
              font-size: 1rem;
            "
          />
        </div>
        <div class="cyber-modal-actions">
          <button class="btn-modal-cancel" onclick="closePasscodeModal()">
            取消
          </button>
          <button class="btn-modal-confirm" onclick="verifyAndLoadData()">
            確認解鎖
          </button>
        </div>
      </div>
    </div>

    <script>
      // ⚠️ 請填入您的 GAS Web App URL ⚠️
      const GAS_WEB_APP_URL =
        "https://script.google.com/macros/s/AKfycbwumQQy5I04ZOhmfRg2dwLZozx7xDIL9CwK2wSr2H-Nk-mkFF4N_4Ke53I1GQtQpwNc/exec";

      const langPack = {
        zht: {
          selectLabel: "📜 選擇戰局紀錄：",
          metaAuthor: "分配人員：",
          metaTime: "發布時間：",
          summaryText: ["總參戰人數", "總體總戰力", "每大組平均戰力"],
          copyTitle: "📋 分配名單 (可直接複製)",
          btnCopyText: "點擊一鍵複製名單",
          tweakTitle: "⚡ 建築物人員配置看板",
          buildingPower: "目前戰力：",
          leaderTag: "隊長",
          viceTag: "副隊長",
          specTitleGather: "採集小隊",
          specTitleAmmo: "子彈小隊",
          specLabelGather: "戰場開啟15分鐘後負責幫忙採集",
          specLabelAmmo: "當建築防守失敗時幫忙撿散落子彈",
          specPowerLabel: "手動指派支援",
          specPowerLabelAmmo: "手動負責人員",
          alertSuccess: "分配名單已成功複製到剪貼簿！",
        },
        en: {
          selectLabel: "📜 Select Battle Record: ",
          metaAuthor: "PIC: ",
          metaTime: "Published Time: ",
          summaryText: [
            "Total Players",
            "Total Power",
            "Average Power / Group",
          ],
          copyTitle: "📋 Allocation Roster (Ready to copy)",
          btnCopyText: "Click to Copy Roster",
          tweakTitle: "⚡ Building Allocation Dashboard",
          buildingPower: "Power: ",
          leaderTag: "CDR",
          viceTag: "V-CDR",
          specTitleGather: "Gathering Squad",
          specTitleAmmo: "Ammo Squad",
          specLabelGather:
            "Responsible for gathering 15 mins after match start",
          specLabelAmmo:
            "Responsible for collecting scattered ammo if building falls",
          specPowerLabel: "Manual Assigned",
          specPowerLabelAmmo: "Manual Assigned",
          alertSuccess: "Roster copied to clipboard successfully!",
        },
      };

      const buildingsConfig = [
        {
          id: "b0",
          nameZht: "1號武器試驗場",
          nameEn: "Prototype Site I",
          gIdx: 0,
        },
        {
          id: "b1",
          nameZht: "1號武器維修廠",
          nameEn: "Repair Facility I",
          gIdx: 0,
        },
        {
          id: "b2",
          nameZht: "2號武器試驗場",
          nameEn: "Prototype Site II",
          gIdx: 1,
        },
        {
          id: "b3",
          nameZht: "2號武器維修廠",
          nameEn: "Repair Facility II",
          gIdx: 1,
        },
        {
          id: "b4",
          nameZht: "3號武器維修廠",
          nameEn: "Repair Facility III",
          gIdx: 2,
        },
        { id: "b5", nameZht: "中轉站", nameEn: "Transit Station", gIdx: 2 },
        {
          id: "b6",
          nameZht: "4號武器維修廠",
          nameEn: "Repair Facility IV",
          gIdx: 3,
        },
        { id: "b7", nameZht: "蒸氣鍋爐", nameEn: "Boiler Room", gIdx: 3 },
      ];

      let historyList = [];
      let currentRecord = null;
      let currentLegion = "LegionA"; // 預設顯示 LegionA
      let currentUIClassLang = "zht";
      let currentCopyLang = "zht";
      let pendingRowIndex = null;

      window.addEventListener("load", fetchHistoryList);

      // 1. 取得歷史戰役列表簡報
      function fetchHistoryList() {
        if (
          GAS_WEB_APP_URL === "YOUR_GAS_WEB_APP_URL_HERE" ||
          !GAS_WEB_APP_URL
        ) {
          alert("請在 HTML 中設定 GAS_WEB_APP_URL！");
          return;
        }

        fetch(GAS_WEB_APP_URL)
          .then((res) => res.json())
          .then((res) => {
            if (
              res.status === "empty" ||
              !res.history ||
              res.history.length === 0
            ) {
              alert("目前試算表中尚無發布的戰況紀錄！");
              return;
            }
            historyList = res.history;

            // 下拉選單填充 (由最新到最舊倒序顯示)
            const select = document.getElementById("historySelect");
            select.innerHTML = "";
            for (let i = historyList.length - 1; i >= 0; i--) {
              const item = historyList[i];
              const option = document.createElement("option");
              option.value = item.rowIndex;
              const lockIcon = item.hasPasscode ? "🔒 " : "";
              option.innerText = `${lockIcon}[${item.updateTime}] ${item.title} (${item.author})`;
              select.appendChild(option);
            }

            // 預設載入最新的一筆 (倒序第一項)
            const latestRowIndex = historyList[historyList.length - 1].rowIndex;
            select.value = latestRowIndex;
            loadDetailData(latestRowIndex);
          })
          .catch((err) => {
            console.error("讀取選單失敗：", err);
            alert("讀取失敗，請確認 GAS URL 是否設定正確。");
          });
      }

      function onSelectHistoryChange() {
        const select = document.getElementById("historySelect");
        const selectedRowIndex = parseInt(select.value);
        loadDetailData(selectedRowIndex);
      }

      // 2. 載入特定活動的詳細數據 (含密碼流程處理)
      function loadDetailData(rowIndex, passcode = "") {
        pendingRowIndex = rowIndex;

        let url = `${GAS_WEB_APP_URL}?rowIndex=${rowIndex}`;
        if (passcode) {
          url += `&passcode=${encodeURIComponent(passcode)}`;
        }

        fetch(url)
          .then((res) => res.json())
          .then((res) => {
            if (res.status === "locked") {
              // 被鎖定，跳出密碼驗證視窗
              document.getElementById("passcodeModal").style.display = "flex";
              document.getElementById("inputPasscode").value = "";
              document.getElementById("inputPasscode").focus();
              return;
            }

            if (res.status === "success") {
              closePasscodeModal();
              currentRecord = res;

              document.getElementById("loadingScreen").style.display = "none";
              document.getElementById("contentSection").style.display = "block";

              renderViewer();
            } else {
              alert("讀取失敗：" + (res.message || "未知錯誤"));
            }
          })
          .catch((err) => {
            console.error("載入詳細資料失敗：", err);
          });
      }

      function verifyAndLoadData() {
        const pwd = document.getElementById("inputPasscode").value.trim();
        if (!pwd) {
          alert("請輸入密碼！");
          return;
        }
        loadDetailData(pendingRowIndex, pwd);
      }

      function closePasscodeModal() {
        document.getElementById("passcodeModal").style.display = "none";
      }

      // 3. 切換軍團 (LegionA / LegionB)
      function switchLegion(legionKey) {
        currentLegion = legionKey;
        if (legionKey === "LegionA") {
          document.getElementById("btnLegionA").classList.add("active");
          document.getElementById("btnLegionB").classList.remove("active");
        } else {
          document.getElementById("btnLegionB").classList.add("active");
          document.getElementById("btnLegionA").classList.remove("active");
        }
        renderViewer();
      }

      function changeLanguage(lang) {
        currentUIClassLang = lang;
        if (lang === "zht") {
          document.getElementById("btnLangZht").classList.add("active");
          document.getElementById("btnLangEn").classList.remove("active");
          document.body.classList.remove("lang-en");
        } else {
          document.getElementById("btnLangEn").classList.add("active");
          document.getElementById("btnLangZht").classList.remove("active");
          document.body.classList.add("lang-en");
        }
        renderViewer();
      }

      // 4. 畫面渲染主邏輯
      function renderViewer() {
        if (!currentRecord) return;

        const record = currentRecord;
        const payload = record.payload || {};
        const lang = langPack[currentUIClassLang];

        // 靜態 UI 標籤翻譯
        document.getElementById("uiSelectLabel").innerText = lang.selectLabel;
        document.getElementById("uiMetaAuthorLabel").innerText =
          lang.metaAuthor;
        document.getElementById("uiMetaTimeLabel").innerText = lang.metaTime;
        document.getElementById("uiCopyTitle").innerText = lang.copyTitle;
        document.getElementById("btnCopyText").innerText = lang.btnCopyText;
        document.getElementById("uiTweakTitle").innerText = lang.tweakTitle;

        // 標頭與元數據
        document.getElementById("viewTitle").innerText =
          record.title || "兵工廠人員分配";
        document.getElementById("viewAuthor").innerText =
          record.author || "指揮官";
        document.getElementById("viewTime").innerText = record.updateTime || "";

        // 安全提取雙軍團或單軍團結構的資料包
        let p = payload;
        if (payload.legions && payload.legions[currentLegion]) {
          p = payload.legions[currentLegion];
        }

        // 數據總計
        document.getElementById("summaryBox").innerHTML = `
          <p>${lang.summaryText[0]} <strong>${p.summary ? p.summary.totalPeople : 0}</strong></p>
          <p>${lang.summaryText[1]} <strong>${p.summary ? p.summary.totalPower.toLocaleString() : 0}</strong></p>
          <p>${lang.summaryText[2]} <strong>${p.summary ? p.summary.avgPower.toLocaleString() : 0}</strong></p>
        `;

        const grid = document.getElementById("buildingGrid");
        grid.innerHTML = "";

        // 建立採集小隊卡片 (跨 2 列)
        const gatherCard = document.createElement("div");
        gatherCard.className = "building-card b-group-spec";
        let gatherArr = p.manualGatherText
          ? p.manualGatherText.split("\n")
          : [];
        let gatherTags = gatherArr
          .map((name) =>
            name.trim()
              ? `<div class="player-tag"><span>⚡ ${name.trim()}</span></div>`
              : "",
          )
          .join("");
        gatherCard.innerHTML = `
          <div class="building-title">${lang.specTitleGather}</div>
          <div class="building-power">${currentUIClassLang === "en" ? lang.specPowerLabel : lang.specLabelGather}</div>
          <div class="drop-zone">${gatherTags || `<div style="color:var(--text-muted);font-size:0.85rem;padding:10px;">${currentUIClassLang === "en" ? "(None)" : "(未指派人員)"}</div>`}</div>
        `;

        // 建立子彈小隊卡片 (跨 2 列)
        const ammoCard = document.createElement("div");
        ammoCard.className = "building-card b-group-spec";
        let ammoArr = p.manualAmmoText ? p.manualAmmoText.split("\n") : [];
        let ammoTags = ammoArr
          .map((name) =>
            name.trim()
              ? `<div class="player-tag" style="border-color:#ff3838;"><span>🎒 ${name.trim()}</span></div>`
              : "",
          )
          .join("");
        ammoCard.innerHTML = `
          <div class="building-title">${lang.specTitleAmmo}</div>
          <div class="building-power">${currentUIClassLang === "en" ? lang.specPowerLabelAmmo : lang.specLabelAmmo}</div>
          <div class="drop-zone">${ammoTags || `<div style="color:var(--text-muted);font-size:0.85rem;padding:10px;">${currentUIClassLang === "en" ? "(None)" : "(未指派人員)"}</div>`}</div>
        `;

        // 依序排列：建築 1~4 -> 採集小隊(跨2列) -> 子彈小隊(跨2列) -> 建築 5~8
        buildingsConfig.forEach((b, idx) => {
          const card = document.createElement("div");
          card.className = `building-card b-group-${b.gIdx}`;

          let bPower = 0;
          let pTagsHtml = "";
          const list = p.buildings ? p.buildings[b.id] || [] : [];

          list.forEach((player) => {
            bPower += player.power || 0;
            let roleClass = "";
            roleLabel = "";
            if (player.isLeader) {
              roleClass = "is-leader";
              roleLabel = `<span class="tag-leader-label">${lang.leaderTag}</span>`;
            } else if (player.isVice) {
              roleClass = "is-vice";
              roleLabel = `<span class="tag-vice-label">${lang.viceTag}</span>`;
            }

            pTagsHtml += `
              <div class="player-tag ${roleClass}">
                <span>${roleLabel}${player.name}</span>
                <strong style="color:var(--text-neon); font-family: 'Share Tech Mono';">${player.power || ""}</strong>
              </div>
            `;
          });

          card.innerHTML = `
            <div class="building-title">${currentUIClassLang === "en" ? b.nameEn : b.nameZht}</div>
            <div class="building-power">${lang.buildingPower}<strong>${bPower.toLocaleString()}</strong></div>
            <div class="drop-zone">${pTagsHtml}</div>
          `;
          grid.appendChild(card);

          // 第一列排完 4 個建築後，插入跨 2 列的採集小隊與子彈小隊
          if (idx === 3) {
            grid.appendChild(gatherCard);
            grid.appendChild(ammoCard);
          }
        });

        switchCopyLang(currentCopyLang);
      }

      function switchCopyLang(lang) {
        currentCopyLang = lang;
        if (!currentRecord) return;

        let p = currentRecord.payload || {};
        if (p.legions && p.legions[currentLegion]) {
          p = p.legions[currentLegion];
        }

        if (lang === "zht") {
          document.getElementById("btnCopyLangZht").classList.add("active");
          document.getElementById("btnCopyLangEn").classList.remove("active");
          document.getElementById("copyTextarea").value = p.copyTextZht || "";
        } else {
          document.getElementById("btnCopyLangEn").classList.add("active");
          document.getElementById("btnCopyLangZht").classList.remove("active");
          document.getElementById("copyTextarea").value = p.copyTextEn || "";
        }
      }

      function copyText() {
        const textarea = document.getElementById("copyTextarea");
        textarea.select();
        navigator.clipboard.writeText(textarea.value);
        alert(langPack[currentUIClassLang].alertSuccess);
      }
    </script>
  </body>
</html>
