<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>兵工廠人員分配系統 3.0</title>

    <link rel="stylesheet" href="https://jeremytseng12.github.io/2647WOSFOUNDRY/css/fonts.css" />
    <link rel="stylesheet" href="https://jeremytseng12.github.io/2647WOSFOUNDRY/css/index.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="icon" type="image/webp" href="https://jeremytseng12.github.io/2647WOSFOUNDRY/media/foundry.webp" />
  </head>
  <body>
    <!-- 系統維護/離線遮罩 -->
    <div id="fullscreenOverlay" class="modal-backdrop" style="display: none; z-index: 99999;">
      <div class="modal-box" style="text-align: center; max-width: 360px;">
        <h3 id="overlayTitle" style="color: #ef4444; margin-bottom: 10px;">🔧 系統維修中</h3>
        <p id="overlayMessage" style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">系統維護中，請稍後再試！</p>
        <button id="btnOverlayReload" class="btn btn-primary" style="display: none;" onclick="location.reload()">重新載入</button>
      </div>
    </div>

    <!-- 幹部登入畫面 -->
    <div id="indexLoginOverlay" class="login-wrapper">
      <div class="login-box">
        <div class="login-header">
          <span class="brand-badge">2647 RGN</span>
          <div class="lang-toggle">
            <button id="btnLoginLangZht" class="lang-btn active" onclick="changeLanguage('zht')">繁中</button>
            <button id="btnLoginLangEn" class="lang-btn" onclick="changeLanguage('en')">EN</button>
          </div>
        </div>
        <h2 id="uiLoginTitle">幹部身分認證</h2>
        <p class="login-desc" id="uiLoginSubtitle">請輸入幹部帳號與通行密碼以存取分配系統</p>
        <div class="field-group">
          <label id="uiLoginAccountLabel">帳號</label>
          <input type="text" id="loginAccount" placeholder="請輸入帳號" autofocus />
        </div>
        <div class="field-group">
          <label id="uiLoginPasskeyLabel">通行密碼</label>
          <input type="password" id="loginPasskey" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter') handleIndexLogin()" />
        </div>
        <button class="btn btn-primary full-width" id="uiBtnLogin" onclick="handleIndexLogin()">驗證並進入系統</button>
        <div id="loginErrorMsg" class="error-msg"></div>
      </div>
    </div>

    <!-- 主系統介面 -->
    <div id="main-content" style="display: none;">
      <!-- 頂部導覽列 -->
      <header class="topbar">
        <div class="topbar-inner">
          <div class="topbar-left">
            <span class="app-title" id="uiMainTitle">兵工廠人員分配系統 3.0</span>
          </div>
          <div class="topbar-right">
            <button class="btn btn-outline btn-sm" id="btnHistoryModal" onclick="openLoadHistoryModal()">📂 編輯歷史紀錄</button>
            <button class="btn btn-outline btn-sm" id="btnViewSystem" onclick="window.open('https://jeremytseng12.github.io/2647WOSFOUNDRY/redirect', '_blank')">📲 公開檢視頁</button>
            <button class="btn btn-outline btn-sm" id="btnManageSystem" onclick="window.open('manage.html', '_blank')">⚙️ 管理後台</button>
            <div class="divider-v"></div>
            <span id="userBadge" class="user-tag"></span>
            <div class="lang-toggle">
              <button id="btnLangZht" class="lang-btn active" onclick="changeLanguage('zht')">繁中</button>
              <button id="btnLangEn" class="lang-btn" onclick="changeLanguage('en')">EN</button>
            </div>
            <button class="btn btn-ghost-danger btn-sm" id="btnLogoutTop" onclick="handleIndexLogout()">登出</button>
          </div>
        </div>
      </header>

      <main class="container">
        <!-- 編輯模式提示橫幅 -->
        <div id="editingNoticeBar" class="edit-banner" style="display: none;">
          <span id="editingNoticeText">✏️ 目前正在編輯歷史紀錄</span>
          <button class="btn btn-sm btn-warning-outline" id="btnCancelEdit" onclick="exitEditMode()">取消編輯（改為新發布）</button>
        </div>

        <div id="errorMessage" class="alert-danger" style="display: none;"></div>

        <!-- 輸入配置雙欄區 -->
        <div class="setup-grid">
          <!-- 左欄：各組隊長設定 -->
          <section class="panel">
            <div class="panel-header">
              <h2 id="uiLeaderTitle">1. 各組隊長設定（戰力需 ≥ 4000）</h2>
            </div>

            <div class="leader-list">
              <div class="leader-row">
                <label id="uiLabelG0">第一組（1號試驗場 & 1號維修廠）</label>
                <div class="input-pair">
                  <input type="text" id="leaderName0" placeholder="隊長名字" />
                  <input type="number" id="leaderPower0" placeholder="戰力" onkeydown="handlePowerEnter(event, 0)" />
                </div>
              </div>
              <div class="leader-row">
                <label id="uiLabelG1">第二組（2號試驗場 & 2號維修廠）</label>
                <div class="input-pair">
                  <input type="text" id="leaderName1" placeholder="隊長名字" />
                  <input type="number" id="leaderPower1" placeholder="戰力" onkeydown="handlePowerEnter(event, 1)" />
                </div>
              </div>
              <div class="leader-row">
                <label id="uiLabelG2">第三組（3號維修廠 & 中轉站）</label>
                <div class="input-pair">
                  <input type="text" id="leaderName2" placeholder="隊長名字" />
                  <input type="number" id="leaderPower2" placeholder="戰力" onkeydown="handlePowerEnter(event, 2)" />
                </div>
              </div>
              <div class="leader-row">
                <label id="uiLabelG3">第四組（4號維修廠 & 蒸氣鍋爐）</label>
                <div class="input-pair">
                  <input type="text" id="leaderName3" placeholder="隊長名字" />
                  <input type="number" id="leaderPower3" placeholder="戰力" onkeydown="handlePowerEnter(event, 3)" />
                </div>
              </div>
            </div>

            <!-- 快速指派常用隊長 -->
            <div class="quick-box">
              <div class="quick-label" id="uiQuickTitle">⚡ 快速填入空缺隊長：</div>
              <div class="quick-chips">
                <button type="button" class="chip-btn" onclick="quickAssignLeader('塔卡 Taca')">塔卡 Taca</button>
                <button type="button" class="chip-btn" onclick="quickAssignLeader('躺平玩家')">躺平玩家</button>
                <button type="button" class="chip-btn" onclick="quickAssignLeader('TSENG')">TSENG</button>
                <button type="button" class="chip-btn" onclick="quickAssignLeader('Iris')">Iris</button>
                <button type="button" class="chip-btn" onclick="quickAssignLeader('Penguin')">Penguin</button>
                <button type="button" class="chip-btn" onclick="quickAssignLeader('LazyGoat')">LazyGoat</button>
                <button type="button" class="chip-btn" onclick="quickAssignLeader('Baby shark')">Baby shark</button>
                <button type="button" class="chip-btn" onclick="quickAssignLeader('馬拉桑')">馬拉桑</button>
              </div>
            </div>

            <!-- 手動副隊長折疊區 -->
            <div class="accordion-box closed" id="viceAccordion">
              <button type="button" class="accordion-toggle" onclick="toggleViceAccordion()">
                <span id="uiViceAccordionTitle">⚙️ 進階：手動指定副隊長（預設自動依戰力指派）</span>
                <span class="arrow">▼</span>
              </button>
              <div class="accordion-content">
                <p class="hint-text" id="uiViceNoticeText">手動指定的副隊長會自動併入平衡，無需重複填在右側主名單。</p>
                <div class="vice-grid">
                  <div>
                    <label id="uiLabelVice0">第 1 組副隊長</label>
                    <div class="input-pair">
                      <input type="text" id="viceName0" placeholder="名字" />
                      <input type="number" id="vicePower0" placeholder="戰力" />
                    </div>
                  </div>
                  <div>
                    <label id="uiLabelVice1">第 2 組副隊長</label>
                    <div class="input-pair">
                      <input type="text" id="viceName1" placeholder="名字" />
                      <input type="number" id="vicePower1" placeholder="戰力" />
                    </div>
                  </div>
                  <div>
                    <label id="uiLabelVice2">第 3 組副隊長</label>
                    <div class="input-pair">
                      <input type="text" id="viceName2" placeholder="名字" />
                      <input type="number" id="vicePower2" placeholder="戰力" />
                    </div>
                  </div>
                  <div>
                    <label id="uiLabelVice3">第 4 組副隊長</label>
                    <div class="input-pair">
                      <input type="text" id="viceName3" placeholder="名字" />
                      <input type="number" id="vicePower3" placeholder="戰力" />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- 右欄：參戰隊員名單 -->
          <section class="panel">
            <div class="panel-header">
              <h2 id="uiMemberTitle">2. 參戰隊員名單</h2>
              <button type="button" class="btn btn-ghost btn-xs" id="btnLoadTestData" onclick="InputTestData()">填入測試資料</button>
            </div>

            <div class="field-group">
              <label id="uiLabelMainList">主平衡分配名單（格式：名字 戰力，一行一人）</label>
              <textarea id="memberInput" rows="7" placeholder="名字A 3500&#10;名字B 2800"></textarea>
            </div>

            <div class="two-cols">
              <div class="field-group">
                <label id="uiLabelGatherList" style="color: #fbbf24;">⚡ 採集小隊（一行一人）</label>
                <textarea id="gatherInput" rows="4" placeholder="例：塔卡"></textarea>
              </div>
              <div class="field-group">
                <label id="uiLabelAmmoList" style="color: #f87171;">🎒 子彈小隊（一行一人）</label>
                <textarea id="ammoInput" rows="4" placeholder="輸入撿子彈名單"></textarea>
              </div>
            </div>

            <div class="action-footer">
              <button type="button" id="btnDistribute" class="btn btn-primary btn-lg full-width" onclick="handleDirectAllocate()">
                ⚡ 立即平衡分配
              </button>
            </div>
          </section>
        </div>

        <!-- 分配結果看板 -->
        <section id="resultSection" class="result-wrapper" style="display: none;">
          <div class="result-toolbar">
            <div class="stats-inline" id="summaryBox"></div>
            <div class="toolbar-actions">
              <button type="button" id="btnScreenshot" class="btn btn-secondary" onclick="captureBuildingGrid()">
                📸 <span id="btnScreenshotText">匯出分配表圖片</span>
              </button>
              <button type="button" id="btnPublish" class="btn btn-success" onclick="openPublishModal()">
                ☁️ 發布結果
              </button>
            </div>
          </div>

          <!-- 建築人員微調看板 -->
          <div class="section-bar">
            <h3 id="uiTweakTitle">建築人員微調區（可直接拖曳更換位置，或在卡片底部直接新增）</h3>
          </div>
          <div class="building-grid" id="buildingGrid"></div>

          <!-- 文字複製區 -->
          <div class="copy-panel">
            <div class="copy-header">
              <h3 id="uiCopyTitle">📋 文字公告名單（可直接複製貼上至遊戲頻道）</h3>
              <div class="copy-controls">
                <div class="lang-toggle">
                  <button id="btnCopyLangZht" class="lang-btn active" onclick="toggleCopyLanguage('zht')">繁中名單</button>
                  <button id="btnCopyLangEn" class="lang-btn" onclick="toggleCopyLanguage('en')">英文名單</button>
                </div>
                <button type="button" id="btnCopyText" class="btn btn-primary btn-sm" onclick="copyTextOutput()">複製名單</button>
              </div>
            </div>
            <textarea id="copyTextarea" class="copy-textarea" rows="8" readonly></textarea>
          </div>
        </section>
      </main>
    </div>

    <!-- 簡潔發布視窗 -->
    <div id="publishModal" class="modal-backdrop" style="display: none;">
      <div class="modal-box">
        <div class="modal-head">
          <h3 id="publishModalHeaderTitle">☁️ 發布分配結果</h3>
          <button class="close-x" onclick="closePublishModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="field-group">
            <label id="lblPublishLegion">發布軍團</label>
            <select id="publishLegionSelect">
              <option value="LegionA">🛡️ 軍團 1 (Legion 1)</option>
              <option value="LegionB">⚔️ 軍團 2 (Legion 2)</option>
            </select>
          </div>
          <div class="field-group" id="eventTypeGroup">
            <label id="lblPublishEventType">活動類型</label>
            <select id="publishEventTypeSelect" onchange="onPublishEventTypeChange()">
              <option value="foundry">兵工廠爭奪戰 (Foundry Battle)</option>
              <option value="tundra">雪域兵器聯賽 (Tundra Arms League)</option>
              <option value="test">測試紀錄 (TEST)</option>
            </select>
          </div>
          <div class="field-group" id="tundraDatePickerGroup" style="display: none;">
            <label>活動日期</label>
            <input type="date" id="tundraDatePicker" onchange="onTundraDateChange()" />
          </div>
          <div class="field-group">
            <label id="lblPublishTitle">紀錄標題</label>
            <input type="text" id="publishTitleInput" />
          </div>
          <div class="field-group">
            <label id="lblPublishAuthor">分配員暱稱</label>
            <input type="text" id="publishAuthorInput" placeholder="輸入暱稱" />
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="btnPublishCancel" onclick="closePublishModal()">取消</button>
          <button class="btn btn-success" id="btnConfirmPublish" onclick="submitToGoogleSheet()">確認發布</button>
        </div>
      </div>
    </div>

    <!-- 簡潔歷史紀錄載入視窗 (純標題 + 自選軍團) -->
    <div id="loadHistoryModal" class="modal-backdrop" style="display: none;">
      <div class="modal-box">
        <div class="modal-head">
          <h3 id="uiLoadHistoryTitle">📂 編輯歷史分配紀錄</h3>
          <button class="close-x" onclick="closeLoadHistoryModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="field-group">
            <label id="lblLoadHistory">1. 選擇場次標題：</label>
            <select id="loadHistorySelect"></select>
          </div>
          <div class="field-group">
            <label id="lblLoadLegion">2. 選擇軍團：</label>
            <select id="loadLegionSelect">
              <option value="LegionA">🛡️ 軍團 1 (Legion 1)</option>
              <option value="LegionB">⚔️ 軍團 2 (Legion 2)</option>
            </select>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="btnLoadCancel" onclick="closeLoadHistoryModal()">取消</button>
          <button class="btn btn-primary" id="btnConfirmLoad" onclick="fetchAndRestoreGridData()">載入編輯</button>
        </div>
      </div>
    </div>
    

    <!-- 腳本引入 -->
    <script src="https://jeremytseng12.github.io/2647WOSFOUNDRY/js/118n.js"></script>
    <script src="https://jeremytseng12.github.io/2647WOSFOUNDRY/js/index.js"></script>
  </body>
</html>
